# Nombre que se mostrará para este flujo de trabajo en GitHub Actions.
name: Angular CICD

# Ejecuta el flujo ante cambios directos o solicitudes de integración a main.
on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

# Permisos mínimos necesarios para leer el código y publicar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs: 
 # ---------- CI: se ejecuta en cada PR y en cada push a main ----------
  build-angular:
    # Utiliza un entorno Linux con las herramientas habituales de GitHub Actions.
    runs-on: ubuntu-latest 

    steps:
      - name: Descargar código
        uses: actions/checkout@v4 

      - name: Instalar Node 
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Compilar Angular
        # Publica la aplicación bajo la ruta del repositorio en GitHub Pages.
        run: npx ng build --base-href /AngularIADespliegues/

      - name: Preparar archivos
        # Solo conserva el resultado de compilación para desplegarlo desde main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/proyectoIA2/browser

  # ---------- CD: solo cuando el código ya está en main ----------
  deploy:
    # Espera a que termine correctamente la compilación y las pruebas.
    needs: build-angular
    # Impide el despliegue en pull requests o pushes a otras ramas.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar aplicación
        id: deployment
        uses: actions/deploy-pages@v4