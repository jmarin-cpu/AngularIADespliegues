name: Angular CICD
on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs: 
 # ---------- CI: se ejecuta en cada PR y en cada push a main ----------
  build-angular:
    runs-on: ubuntu-latest 

    steps:
      - name: Descargar código
        uses: actions/checkout@v4 

      - name: Instalar Node 
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Compilar Angular
        run: npx ng build --base-href /AngularIADespliegues/

      - name: Preparar archivos
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/proyectoIA2/browser

  # ---------- CD: solo cuando el código ya está en main ----------
  deploy:
    needs: build-angular
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar aplicación
        id: deployment
        uses: actions/deploy-pages@v4