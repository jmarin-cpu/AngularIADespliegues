name: Angular CI
on:
  push:
    branches:
    - main

jobs: 
  build-angular:
    runs-on: ubuntu-latest 

    steps:
      - name: Descargar código
        uses: actions/checkout@v4 

      - name: Instalar Node 
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar Angular
        run: npx ng build --base-href /AngularIADespliegues/

      - name: Preparar archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/proyectoIA2/browser

  deploy:
    needs: build-angular
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar aplicación
        id: deployment
        uses: actions/deploy-pages@v4