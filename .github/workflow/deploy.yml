name: Angular CI
on:
  push:
    branches:
    - main

jobs: 
  build-angular:
    runs-on: ubuntu-latest 

    steps:
      - name: Descargar código
        uses: actions/checkout@v4 

      - name: Instalar Node 
        uses: actions/setup-node@v4
        with:
        node-version: 20

      - name: Instalar dependencias
        run: npm install